<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Solar Web</title>
		<meta name="description" content="Simple starter page for the Solar Web project">
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<header>
			<h1>Solar Web</h1>
			<p>A simple starter HTML document.</p>
		</header>

		<main>
			<section id="planet-view" aria-label="Planet viewer">
				<h2>Planet viewer</h2>
				<div id="planet-controls" style="margin-bottom:12px;">
					<button id="prevBtn" type="button">◀ Previous</button>
					<span id="planet-index" style="margin:0 12px;">0 / 0</span>
					<button id="nextBtn" type="button">Next ▶</button>
				</div>
				<div id="planet-info">
					<p>Planet data will appear here after loading.</p>
				</div>
				<!-- 3D canvas will be inserted here by Three.js helper -->
				<div id="three-container" style="width:100%;height:360px;margin-top:12px;"></div>
			</section>
		</main>

			<!-- Import map to resolve bare-module specifier 'three' for example loaders -->
			<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.155.0/build/three.module.js"
				}
			}
			</script>
			<!-- Load Three.js and example loaders as ES modules, then expose globals for legacy scripts -->
			<script type="module">
				import * as THREE from 'three';
				import { FBXLoader } from 'https://unpkg.com/three@0.155.0/examples/jsm/loaders/FBXLoader.js';
				import { GLTFLoader } from 'https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js';
				// expose to window for non-module scripts (3dfunctions.js, main.js)
				window.THREE = THREE;
				window.FBXLoader = FBXLoader;
				window.GLTFLoader = GLTFLoader;
			</script>
			<!-- small 3D helper that uses global THREE -->
			<script src="assets/src/3dfunctions.js" defer></script>
			<script src="main.js" defer></script>
	</body>
</html>
