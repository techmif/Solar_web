<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Solar Web</title>
		<meta name="description" content="Simple starter page for the Solar Web project">
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<header>
			<h1>Solar Web</h1>
			<p>A simple starter HTML document.</p>
		</header>

		<main>
			<section>
				<h2>Getting started</h2>
				<p>Open this file in your browser or continue editing <code>index.html</code>, <code>index.css</code> and <code>main.js</code>.</p>
			</section>

			<section id="planet-view" aria-label="Planet viewer">
				<h2>Planet viewer</h2>
				<div id="planet-controls" style="margin-bottom:12px;">
					<button id="prevBtn" type="button">◀ Previous</button>
					<span id="planet-index" style="margin:0 12px;">0 / 0</span>
					<button id="nextBtn" type="button">Next ▶</button>
				</div>
				<div id="planet-info">
					<p>Planet data will appear here after loading.</p>
				</div>
			</section>
		</main>

		<script src="main.js" defer></script>
	</body>
</html>
