<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Solar Web</title>
		<meta name="description" content="Simple starter page for the Solar Web project">
		<link rel="stylesheet" href="index.css">
	</head>
	<body>

		<main id="planet-view" aria-label="Planet viewer">
			<h2 class="visually-hidden">Planet viewer</h2>a
			<div id="planet-info">
				<p>Planet data will appear here after loading.</p>
			</div>
			<!-- 3D canvas will be inserted here by Three.js helper -->
			<div id="three-container"></div>

			<!-- Mini alert placed near the planet model to suggest interactions -->
			<div id="mini-alert" class="mini-alert" role="status" aria-live="polite" aria-hidden="false">
				<span class="mini-alert-text">Tip: try rotating or zooming the planet</span>
				<button type="button" class="mini-alert-close" aria-label="Dismiss">✕</button>
			</div>

			<!-- Planet menu overlay -->
			<div id="planet-menu" class="planet-menu hidden" role="dialog" aria-labelledby="menu-title">
				<div class="planet-menu-header">
					<h3 id="menu-title">Solar System</h3>
					<button type="button" class="menu-close" aria-label="Close menu">✕</button>
				</div>
				<ul class="planet-list">
					<li><a href="#" data-planet="0">Mercury</a></li>
					<li><a href="#" data-planet="1">Venus</a></li>
					<li><a href="#" data-planet="2">Earth</a></li>
					<li><a href="#" data-planet="3">Mars</a></li>
					<li><a href="#" data-planet="4">Jupiter</a></li>
					<li><a href="#" data-planet="5">Saturn</a></li>
					<li><a href="#" data-planet="6">Uranus</a></li>
					<li><a href="#" data-planet="7">Neptune</a></li>
				</ul>
			</div>

			<div id="planet-controls">
				<button id="prevBtn" class="nav-btn" type="button" aria-label="Previous">
					<img src="assets/images/rodykle%20kaireni.png" alt="Previous" class="nav-arrow">
				</button>
				<img src="assets/images/meniu.png" alt="Menu" id="menu-icon" class="menu-icon">
				<span id="planet-index">0 / 0</span>
				<button id="nextBtn" class="nav-btn" type="button" aria-label="Next">
					<img src="assets/images/rodykle%20desinen.png" alt="Next" class="nav-arrow">
				</button>
			</div>
		</main>

			<!-- Import map to resolve bare-module specifier 'three' for example loaders -->
			<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.155.0/build/three.module.js"
				}
			}
			</script>
			<!-- Load Three.js and example loaders as ES modules, then expose globals for legacy scripts -->
			<script type="module">
				import * as THREE from 'three';
				import { FBXLoader } from 'https://unpkg.com/three@0.155.0/examples/jsm/loaders/FBXLoader.js';
				import { GLTFLoader } from 'https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js';
				// expose to window for non-module scripts (3dfunctions.js, main.js)
				window.THREE = THREE;
				window.FBXLoader = FBXLoader;
				window.GLTFLoader = GLTFLoader;
			</script>
			<!-- small 3D helper that uses global THREE -->
			<script src="assets/src/3dfunctions.js" defer></script>
			<script src="main.js" defer></script>
	</body>
</html>
